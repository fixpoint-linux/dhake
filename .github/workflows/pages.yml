# Deploy the dhake documentation to GitHub Pages on every push.
#
# The page is an Elm app (src/Main.elm) rendered against the shared
# Fixpoint.* design package (the `design` submodule) and pre-rendered to a
# static dist/index.html by `npm run build` (elm make + scripts/ssg.mjs).
# The workflow builds it first, then uploads the generated dist/ directory.
#
# Enable once in the repo: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Elm app imports the Fixpoint.* design package from the `design`
          # git submodule, so it must be checked out for the build.
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build docs
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

